spring:
  application:
    name: learning-platform
  profiles:
    default: dev
  jpa:
    # сессия Hibernate НЕ живёт до конца HTTP-запроса: все ленивые связи
    # загружаются в сервисах, наружу отдаются только DTO
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

app:
  demo-data:
    enabled: false

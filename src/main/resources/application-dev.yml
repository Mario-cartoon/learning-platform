# Локальная разработка: PostgreSQL на localhost (или из docker compose up db)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}

logging:
  level:
    com.example.learningplatform: DEBUG
    # раскомментировать, чтобы видеть SQL и ловить N+1
    # org.hibernate.SQL: DEBUG
